  lessons:[
    {
      title:"1. Reported Speech дегеніміз не?",
      text:`Reported Speech — басқа адамның сөзін жанама түрде жеткізу.

Direct Speech — адамның айтқан сөзін тікелей, тырнақша ішінде беру.

Reported Speech — сол сөздің мазмұнын өз сөзімізбен басқа адамға жеткізу.

Мысалы:
Direct: Aida said, "I am happy."
Reported: Aida said that she was happy.

Екі сөйлемнің негізгі мағынасы бірдей. Бірақ екінші сөйлемде есімдік пен шақ өзгерген.

Бұл құрылым жаңалықтарды жеткізуге, әңгіме айтуға және басқа адамның пікірін баяндауға қажет.`,

      title:"2. Backshift — шақтарды өзгерту",
      text:`Reported Speech кезінде өткен шақтағы reporting verb қолданылса, көптеген жағдайларда шақ бір қадам артқа ауысады.

Бұл құбылыс backshift деп аталады.

Present Simple → Past Simple.
Present Continuous → Past Continuous.
Present Perfect → Past Perfect.
Past Simple → Past Perfect.
Will → Would.
Can → Could.

Мысалы: "I am studying."

      text:`Сөзді басқа адам жеткізгенде есімдіктер өзгеруі мүмкін.

I → he немесе she.
My → his немесе her.
We → they.

Уақытқа қатысты сөздер де өзгеруі мүмкін:
now → then.
today → that day.
yesterday → the day before.
tomorrow → the next day.
here → there.

Say + that-clause.
Tell + object + that-clause.

He said that he was tired.
He told me that he was tired.

Tell етістігінен кейін көбіне тыңдаушы көрсетіледі.

Сондықтан He told that he was tired деп айту қате.

Теріс бұйрық:

"Open the window."
The teacher told me to open the window.

"Don't talk."
The teacher told us not to talk.

Asked + object + if/whether + subject + verb.

"Are you ready?"

"Do you like music?"

Жанама сұрақта хабарлы сөйлемнің сөз тәртібі қолданылады.

Сондықтан He asked if was I ready деген сөйлем қате.

Формула:
Asked + question word + subject + verb.

"Where do you live?"
She asked where I lived.

Ең маңыздысы — жанама сұрақта бастауыш пен баяндауыштың орны кәдімгі хабарлы сөйлемдегідей болады.

    title:"The College Interview",
    text:`The College Interview

On Tuesday, Ms Zhanar gave her students a journalism task. She asked everyone to interview a classmate and report the answers.

Madina said that she was learning graphic design and that she wanted to work in a printing studio. She also said that she had visited a museum the previous weekend.

Timur told Madina that he could edit videos, but he could not draw very well.

When Madina asked whether he liked photography, Timur answered that he did.

The teacher reminded everyone not to copy answers from the internet. She asked the students to write at least six reported sentences in their notebooks.

Some students wanted to record audio, but Ms Zhanar said that recording was optional.

At the end of the lesson, Timur asked where the homework should be uploaded.

The teacher explained that the students should bring their notebooks to the next lesson instead of uploading files.

Madina finished her interview first, but she had not checked all the pronouns in her sentences. Her partner helped her correct them.

The teacher was pleased because the students had practised both speaking and writing.`,
